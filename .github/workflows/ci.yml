name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:all
      - run: npm run test:coverage
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_DATABASE_URL: postgresql://build:build@localhost:5432/build
          APP_URL: http://localhost:3000

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # scripts/test-integration.mjs migrates this database, then runs `vitest --project integration`.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test?schema=public
      APP_URL: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration

  e2e:
    name: End-to-end (desktop + mobile, stub AI)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?schema=public
      APP_URL: http://localhost:3000
      # The Playwright config starts the stub DeepSeek server and points the app at it;
      # these are the values it also injects into the dev server (tech spec § 14, § 15).
      DEEPSEEK_API_KEY: stub
      PHOTO_LOGGING_ENABLED: 'true'
      SCHEDULER_ENABLED: 'true'
      SIGNUP_RATE_LIMIT: '100000'
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run db:deploy
      - run: npm run db:seed
      # Runs every Playwright project (setup, auth, chromium, mobile) against the stub AI server.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  migrations:
    name: Migration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Diffs prisma/migrations against the base branch: DROP / ALTER … TYPE need a
      # `-- decision:` comment; every product migration starts with SET lock_timeout.
      - run: node scripts/check-migrations.mjs
        env:
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality, integration, e2e, migrations]
    env:
      IMAGE: registry.hamdocker.ir/${{ secrets.HAMDOCKER_ORG }}/dietyaar
    outputs:
      tag: ${{ steps.tag.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          set -e
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name web --network ci -p 3000:3000 \
            -e DATABASE_URL=postgresql://postgres:postgres@db:5432/app?schema=public \
            -e DIRECT_DATABASE_URL=postgresql://postgres:postgres@db:5432/app?schema=public \
            -e APP_URL=http://localhost:3000 \
            -e SCHEDULER_ENABLED=false \
            -e NODE_ENV=production app:ci
          docker exec web pg_dump --version
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health && curl -sf http://localhost:3000/api/live; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then docker logs web; exit 1; fi
      - name: Log in to registry.hamdocker.ir
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: registry.hamdocker.ir
          username: ${{ secrets.HAMDOCKER_USERNAME }}
          password: ${{ secrets.HAMDOCKER_PASSWORD }}
      - name: Push image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag app:ci "$IMAGE:${{ steps.tag.outputs.short }}"
          docker push "$IMAGE:${{ steps.tag.outputs.short }}"

  deploy:
    name: Deploy to Darkube
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The Darkube CLI is shipped as a container image (docs.hamravesh.com › GitHub Actions).
    container: hamravesh.hamdocker.ir/public/darkube-cli:v1.1
    steps:
      - name: darkube deploy
        run: >-
          darkube deploy --ref main --token "$DARKUBE_DEPLOY_TOKEN" --app-id "$DARKUBE_APP_ID"
          --image-tag "${{ needs.docker.outputs.tag }}" --job-id "$GITHUB_RUN_ID" --stateless-app true
        env:
          DARKUBE_DEPLOY_TOKEN: ${{ secrets.DARKUBE_DEPLOY_TOKEN }}
          DARKUBE_APP_ID: ${{ secrets.DARKUBE_APP_ID }}
