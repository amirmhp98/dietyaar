# Production stack for the self-hosted VPS (decision 026): the CI-built image,
# Postgres and MinIO on the same box, Caddy for TLS. Lives at /opt/dietyaar on
# the server next to a `.env` copied from `.env.example`. Nothing but Caddy is
# reachable from outside; the app, database and bucket share the compose network.
#
#   docker compose pull app && docker compose up -d      # deploy (CI does this)
#   docker compose logs -f app                            # follow the app
#   docker compose exec db psql -U postgres app           # open a shell on the database

services:
  app:
    image: ${IMAGE:-ghcr.io/amirmhp98/dietyaar:latest}
    container_name: dietyaar
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database and bucket hosts are service names.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/app?schema=public&connection_limit=10
      DIRECT_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/app?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: dietyaar
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_KEY_PREFIX: prod/
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g
    logging: &logging
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  db:
    # Major version matches `postgresql-client` in the Dockerfile (pg_dump for backups).
    image: postgres:17-alpine
    container_name: dietyaar-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  minio:
    image: minio/minio
    container_name: dietyaar-minio
    restart: unless-stopped
    # No console: the bucket is private and only the app talks to it.
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: 'off'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  # One-shot: creates the `dietyaar` bucket and exits.
  minio-init:
    image: minio/mc
    container_name: dietyaar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/dietyaar
      "

  caddy:
    image: caddy:2-alpine
    container_name: dietyaar-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging: *logging

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
