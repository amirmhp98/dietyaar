# Local stack. `npm run db:up` starts only Postgres for `npm run dev`,
# `npm run storage:up` the MinIO photo bucket (the S3_* values in .env.example);
# `docker compose up --build` runs the whole thing the way production does.
services:
  db:
    image: postgres:16-alpine
    container_name: 'dietyaar-db'
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible photo storage for local dev and e2e (improvement plan B26).
  # API on 9000, console on 9001 (same credentials).
  minio:
    image: minio/minio
    container_name: 'dietyaar-minio'
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dietyaar
      MINIO_ROOT_PASSWORD: dietyaar-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the `dietyaar-dev` bucket and exits.
  minio-init:
    image: minio/mc
    container_name: 'dietyaar-minio-init'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dietyaar dietyaar-dev-secret &&
      mc mb --ignore-existing local/dietyaar-dev
      "

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 'dietyaar'
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Inside the compose network the database host is the service name.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  minio-data:
